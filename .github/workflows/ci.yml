name: CI & Zero-Leak Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    name: Zero-Leak & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for Hardcoded Local Paths & Secrets
        run: |
          echo "Running Zero-Leak Sanitization Check..."
          python3 -c "
          import os, re, sys
          pattern = re.compile(r'/Users/(?!runner\b)[a-zA-Z0-9_\-]+')
          win_pattern = re.compile(r'C:\\\\Users\\\\(?!runneradmin\b)[a-zA-Z0-9_\-]+', re.IGNORECASE)
          found = False
          for root, dirs, files in os.walk('.'):
              if '.git' in dirs: dirs.remove('.git')
              for f in files:
                  p = os.path.join(root, f)
                  try:
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fp:
                          for idx, line in enumerate(fp, 1):
                              if pattern.search(line) or win_pattern.search(line):
                                  print(f'::error file={p},line={idx}::Hardcoded user home path detected: {line.strip()}')
                                  found = True
                  except Exception:
                      pass
          if found:
              sys.exit(1)
          print('✔ Zero-Leak Path Audit passed.')
          "

  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    needs: security-audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -v
